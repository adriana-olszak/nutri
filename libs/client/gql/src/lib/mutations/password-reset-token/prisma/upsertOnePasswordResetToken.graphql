mutation UpsertOnePasswordResetToken(
    $where: PasswordResetTokenWhereUniqueInput!
    $create: PasswordResetTokenCreateInput!
    $update: PasswordResetTokenUpdateInput!
  ) {
    upsertOnePasswordResetToken(where: $where, create: $create, update: $update) {
      ...PasswordResetTokenFields
    }
  }