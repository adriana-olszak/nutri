query FindFirstRefreshToken(
    $where: RefreshTokenWhereInput
    $orderBy: [RefreshTokenOrderByWithRelationInput]
    $cursor: RefreshTokenWhereUniqueInput
    $take: Int
    $skip: Int
    $distinct: [RefreshTokenScalarFieldEnum]
  ) {
    findFirstRefreshToken(
      where: $where
      orderBy: $orderBy
      cursor: $cursor
      take: $take
      skip: $skip
      distinct: $distinct
    ) {
      ...RefreshTokenFields
    }
  }