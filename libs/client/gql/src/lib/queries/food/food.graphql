query Food($id: ID!) {
  food(id: $id) {
    description
    id
    sourceId
    scientificName
    importInfoId
    createdAt
    updatedAt
    nutrients {
      id
      amount
      min
      median
      max
      confidenceCode
      sourceId
      nutrientId
      nutrient {
        name
        unitName
      }
    }
  }
}
