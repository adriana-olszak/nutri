query FindFirstUser(
    $where: UserWhereInput
    $orderBy: [UserOrderByWithRelationInput]
    $cursor: UserWhereUniqueInput
    $take: Int
    $skip: Int
    $distinct: [UserScalarFieldEnum]
  ) {
    findFirstUser(
      where: $where
      orderBy: $orderBy
      cursor: $cursor
      take: $take
      skip: $skip
      distinct: $distinct
    ) {
      ...UserFields
    }
  }