query FindFirstSession(
    $where: SessionWhereInput
    $orderBy: [SessionOrderByWithRelationInput]
    $cursor: SessionWhereUniqueInput
    $take: Int
    $skip: Int
    $distinct: [SessionScalarFieldEnum]
  ) {
    findFirstSession(
      where: $where
      orderBy: $orderBy
      cursor: $cursor
      take: $take
      skip: $skip
      distinct: $distinct
    ) {
      ...SessionFields
    }
  }