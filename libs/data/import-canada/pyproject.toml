[tool.coverage.run]
branch = true
source = [ "data_import_canada" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html:'../../../coverage/libs/data/import-canada/html' --cov-report xml:'../../../coverage/libs/data/import-canada/coverage.xml' --html='../../../reports/libs/data/import-canada/unittests/html/index.html' --junitxml='../../../reports/libs/data/import-canada/unittests/junit.xml'"

[tool.poetry]
name = "data-import-canada"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "data_import_canada"

  [tool.poetry.dependencies]
  python = "^3.12.0"
  pydantic = "^1.8.2"
  PyYAML = "^6.0"
  pandas = "^1.3.3"
  sqlalchemy = "^1.4.25"
  sentence-transformers = "^2.1.0"
  psycopg2 = "2.9.9"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.0.2"
  flake8 = "6.0.0"
  pytest = "7.3.1"
  pytest-sugar = "0.9.7"
  pytest-cov = "4.1.0"
  pytest-html = "3.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
