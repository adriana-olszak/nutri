version: '3.7'
services:
  postgres-nutri:
    container_name: postgres-nutri
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_NAME}
      PG_DATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: '--wal-segsize=512'
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - ./deploy/docker-compose/postgres-nutri:/docker-entrypoint-initdb.d
      - pgdata-postgres-nutri:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  csvkit-importer:
    build:
      context: ./deploy/docker-compose/csvkit-importer
      dockerfile: Dockerfile.csvkit
    environment:
      POSTGRES_HOST: postgres-nutri
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PYTHONUNBUFFERED: 1
    volumes:
      - ./deploy/docker-compose/csvkit-importer/data:/data
      - ./deploy/docker-compose/csvkit-importer/config:/config
      - ./deploy/docker-compose/csvkit-importer/import_script.py:/import_script.py
    command: python /import_script.py
    depends_on:
      postgres-nutri:
        condition: service_healthy

  # Used for access to local EMAIL notification functionality
  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI

  redis:
    image: 'bitnami/redis:latest'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis-nutri:/bitnami/redis/data

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_LOG_FRONTEND_ENABLED=true
      - GF_LOG_FRONTEND_CUSTOM_ENDPOINT=http://localhost:12347/collect
      - GF_TRACING_OPENTELEMETRY_JAEGER_ADDRESS=http://host.docker.internal:14268/api/traces
      - GF_TRACING_OPENTELEMETRY_JAEGER_PROPAGATION=jaeger,w3c
      - GF_FEATURE_TOGGLES_ENABLE=accessControlOnCall lokiLogsDataplane exploreLogsShardSplitting
      - GF_INSTALL_PLUGINS=https://storage.googleapis.com/integration-artifacts/grafana-lokiexplore-app/grafana-lokiexplore-app-latest.zip;grafana-lokiexplore-app
    ports:
      - 3000:3000/tcp
    volumes:
      - ./deploy/docker-compose/grafana:/etc/grafana/provisioning
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  loki:
    image: grafana/loki:3.3.2
    environment:
      LOG_CLUSTER_DEPTH: '8'
      LOG_SIM_TH: '0.3'
    ports:
      - '3100:3100'
    volumes:
      - ./deploy/docker-compose/loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: on-failure

  alloy:
    image: grafana/alloy:latest
    environment:
      - AGENT_MODE=flow
    command:
      [
        'run',
        '--server.http.listen-addr=0.0.0.0:12345',
        '--stability.level=public-preview',
        '/etc/alloy/config.alloy',
      ]
    volumes:
      - ./deploy/docker-compose/alloy/config.river:/etc/alloy/config.alloy
    ports:
      - '12345:12345'
      - '12347:12347'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  tempo:
    image: grafana/tempo:2.6.0
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./deploy/docker-compose/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - '14268:14268' # jaeger ingest
      - '3200:3200' # tempo
      - '4317:4317' # otlp grpc
      - '4318:4318' # otlp http

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command: >
      --enable-feature=remote-write-receiver
      --enable-feature=exemplar-storage
      --enable-feature=native-histograms
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ./deploy/docker-compose/prometheus:/etc/prometheus
      - prom_data:/prometheus

networks:
  monitoring:

volumes:
  grafana_data:
  prom_data:
  pgdata-postgres-nutri:
  redis-nutri:
