[tool.coverage.run]
branch = true
source = [ "ml" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html:'../../coverage/apps/ml/html' --cov-report xml:'../../coverage/apps/ml/coverage.xml' --html='../../reports/apps/ml/unittests/html/index.html' --junitxml='../../reports/apps/ml/unittests/junit.xml'"

[tool.poetry]
name = "ml"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "ml"

  [tool.poetry.dependencies]
  python = "^3.12.0"
  sentence-transformers = "^2.1.0"
  flask = "^2.0.1"
  flask-restx = "^1.3.0"
  sqlalchemy = "^2.0.35"
  flask-sqlalchemy = "^3.1.1"
  psycopg2 = "^2.9.9"
  procrastinate = "^2.14.0"
  pgvector = "^0.3.3"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.0.2"
  flake8 = "6.0.0"
  pytest = "7.3.1"
  pytest-sugar = "0.9.7"
  pytest-cov = "4.1.0"
  pytest-html = "3.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
